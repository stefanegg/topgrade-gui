name: Release

# Builds the installers for a version tag and attaches them to a GitHub
# Release. Create the tag with scripts/release.sh, then push it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # build.rs derives the version from tags

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts (latest.json is generated and uploaded too).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Ad-hoc code signature for the macOS bundle (no Apple account): seals
          # the bundle so it isn't reported as "damaged", but isn't notarized.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ env.TAG }}
          releaseName: Topgrade GUI ${{ env.TAG }}
          releaseBody: See CHANGELOG.md.
          releaseDraft: false
      - name: Use changelog section as release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
