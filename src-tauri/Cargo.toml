[package]
name = "topgrade-gui"
version = "0.2.0"
description = "Desktop GUI for topgrade"
authors = ["Stefan Eggenschwiler"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "topgrade_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
vte = "0.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
regex = "1.13.1"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.14.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSString"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"
